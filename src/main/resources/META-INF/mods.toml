modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://discord.gg/BKyvxfdykN"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/gtbcs-spellbooks"
credits="Thanks Amadhe for providing Call Forth The Dead King icon; Thanks Mr.sup for translation."
authors="${mod_authors}"
description='''
GTBC's Spellbooks contains original spells that do not require any kind of extra dependencies. This is a heavily cut-down version of T.O Tweaks mod.

PRIVATE BACKPORT: NeoForge 1.21.1 -> Forge 1.20.1. All Rights Reserved. Not for redistribution.
'''
logoFile="icon.png"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=true
    versionRange="[1.20.1-3.15.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.7,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="[5.0,)"
    ordering="NONE"
    side="BOTH"

# GTBC's SpellLib/API 3.0.0 Forge 1.20.1 (AbstractUniqueSpell, particle managers, echo curio base).
[[dependencies.${mod_id}]]
    modId="gtbcs_spell_lib"
    mandatory=true
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="BOTH"
